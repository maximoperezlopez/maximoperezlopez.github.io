        courses: "Computational Geometry, Randomized Algorithms"
        highlights:
          - "I tailored an existing hierarchical relative compression implementation to DNA sequences, improving the compression runtime by an order of magnitude, and achieving half the size for the compression of diverse bacterial datasets in comparison to simple relative compression."
          - "I led a project to design a more efficient algorithm to determinize Wheeler graphs, achieving almost output-sensitive time and almost quadratic improvement over the state of the art. "
          - "Four papers published in conference venues (SOFSEM, CPM, SEA and SPIRE), and a journal version in Information and Computation."

